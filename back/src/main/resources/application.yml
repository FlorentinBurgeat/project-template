spring:
  application:
    name: template-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wishlist_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:motdepasse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM_NAME:template-realm}
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM_NAME:template-realm}/protocol/openid-connect/certs

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Keycloak Configuration
keycloak:
  url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8081}
  external-url: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8081}
  realm:
    name: ${KEYCLOAK_REALM_NAME:template-realm}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    realm: master
    client-id: admin-cli
  frontend:
    client-id: ${KEYCLOAK_FRONTEND_CLIENT_ID:frontend-client}
    redirect-uris:
      - http://localhost:5173/*
      - http://localhost:3000/*
    web-origins:
      - http://localhost:5173
      - http://localhost:3000
  backend:
    client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:backend-service}
    client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:change-this-secret-in-production}

logging:
  level:
    org.springframework.security: DEBUG
    org.jetbrains.exposed: DEBUG
    org.keycloak: INFO
