spring:
  application:
    name: template-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wishlist_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:motdepasse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:jwt_secret_change_in_production}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes in ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in ms

logging:
  level:
    org.springframework.security: DEBUG
    org.jetbrains.exposed: DEBUG
