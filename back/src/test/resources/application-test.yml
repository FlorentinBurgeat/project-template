# The datasource comes from the Testcontainers PostgreSQL container (@ServiceConnection);
# Flyway runs the real migrations from application.yml.
spring:
  application:
    name: template-api-test

keycloak:
  realm:
    # No Keycloak is running in tests
    initialize: false

server:
  port: 0

springdoc:
  api-docs:
    # The contract test reads /v3/api-docs
    enabled: true
