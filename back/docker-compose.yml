services:
    database:
        container_name: ${DOCKER_DATABASE_CONTAINER_NAME}
        image: postgres:15
        restart: always
        ports:
            - '${POSTGRES_PORT}:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
        networks:
            - app-network

    keycloak:
        container_name: ${DOCKER_KEYCLOAK_CONTAINER_NAME:-keycloak}
        build:
            context: .
            dockerfile: keycloak/Dockerfile
            additional_contexts:
                theme: ../keycloak-theme/dist_keycloak
        restart: always
        ports:
            - '${KEYCLOAK_PORT:-8081}:8080'
        environment:
            # Keycloak admin credentials
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

            # Database configuration (Keycloak uses same PostgreSQL instance)
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://database:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
            KC_DB_USERNAME: ${POSTGRES_USER}
            KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

            # Keycloak hostname configuration (v2)
            KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
            KC_HTTP_ENABLED: true
            KC_HEALTH_ENABLED: true
            KC_METRICS_ENABLED: true

            # Import strategy: only import realm if it doesn't exist yet
            KC_SPI_IMPORT_DIR_STRATEGY: IGNORE_EXISTING

            # Logging
            KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}

        command: start-dev --import-realm
        depends_on:
            - database
        volumes:
            - ./keycloak/template-realm.json:/opt/keycloak/data/import/template-realm.json:ro
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo 'OK'"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 40s

    pgadmin:
        container_name: ${DOCKER_PGADMIN_CONTAINER_NAME}
        image: dpage/pgadmin4
        restart: always
        ports:
            - '${PGADMIN_PORT}:80'
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        depends_on:
            - database
        networks:
            - app-network

    backend:
        container_name: ${DOCKER_BACKEND_CONTAINER_NAME}
        build:
            context: .
            dockerfile: Dockerfile.dev
        restart: always
        ports:
            - '${PORT}:8080'
        depends_on:
            keycloak:
                condition: service_healthy
            database:
                condition: service_started
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_JPA_HIBERNATE_DDL_AUTO: validate
            SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
            KEYCLOAK_INTERNAL_URL: http://keycloak:8080
            KEYCLOAK_EXTERNAL_URL: http://localhost:${KEYCLOAK_PORT:-8081}
            KEYCLOAK_REALM_NAME: ${KEYCLOAK_REALM_NAME:-template-realm}
            KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
            KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
            KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-frontend-client}
            KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-backend-service}
            KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-change-this-secret-in-production}
            # DevTools configuration
            SPRING_DEVTOOLS_RESTART_ENABLED: true
            SPRING_DEVTOOLS_LIVERELOAD_ENABLED: false
        volumes:
            # Mount source code for hot reload
            - ./src:/app/src
            # Mount target directory to persist compiled classes
            - maven-target:/app/target
            # Cache Maven dependencies
            - maven-cache:/root/.m2
        networks:
            - app-network

volumes:
    pgdata:
    maven-target:
    maven-cache:

networks:
    app-network:
        driver: bridge
