spring:
  application:
    name: template-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wishlist_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:motdepasse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens carry the browser-facing issuer (KC_HOSTNAME), so the iss check uses the external URL,
          # while signing keys are fetched over the Docker network via the internal URL.
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM_NAME:template}
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM_NAME:template}/protocol/openid-connect/certs

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Keycloak Configuration
keycloak:
  url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8081}
  external-url: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8081}
  realm:
    name: ${KEYCLOAK_REALM_NAME:template}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    realm: master
    client-id: admin-cli
  frontend:
    client-id: ${KEYCLOAK_FRONTEND_CLIENT_ID:frontend-client}
    # Exact callback URIs (one per locale). Registered in Keycloak and used as the backend allow-list;
    # the first entry is the default when the frontend sends none.
    redirect-uris:
      - http://localhost:3000/en/auth/callback
      - http://localhost:3000/fr/auth/callback
    web-origins:
      - http://localhost:5173
      - http://localhost:3000
  backend:
    client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:backend-service}
    client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:change-this-secret-in-production}

auth:
  cookie:
    # Must be true whenever the app is served over HTTPS
    secure: ${AUTH_COOKIE_SECURE:false}

logging:
  level:
    org.keycloak: INFO
